<title>ALLO2 專案管理</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#dde3ea;
  --navy:#1f3864;--accent:#2f6fb0;
  --red:#c0392b;--redbg:#fdecea;--amber:#b7791f;--amberbg:#fff6e0;
  --green:#1e7e4f;--greenbg:#e6f4ec;--grey:#7a8694;--greybg:#eef1f4;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121619;--panel:#1a2026;--ink:#e7edf3;--muted:#9aa8b6;--line:#2b343d;
  --navy:#8fb3e8;--accent:#5b9bd5;--redbg:#3a1f1d;--amberbg:#352a14;
  --greenbg:#15301f;--greybg:#232a31;--shadow:0 1px 3px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#121619;--panel:#1a2026;--ink:#e7edf3;--muted:#9aa8b6;--line:#2b343d;
  --navy:#8fb3e8;--accent:#5b9bd5;--redbg:#3a1f1d;--amberbg:#352a14;
  --greenbg:#15301f;--greybg:#232a31;--shadow:0 1px 3px rgba(0,0,0,.4);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:40;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:max(12px,env(safe-area-inset-top))}
header h1{margin:0;font-size:16px;font-weight:700}
header .tag{font-size:10.5px;background:rgba(255,255,255,.18);padding:3px 7px;border-radius:4px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
nav{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);
 padding:0 6px;overflow-x:auto;position:sticky;top:48px;z-index:30;-webkit-overflow-scrolling:touch}
nav button{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);
 padding:12px 13px;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;
 background:var(--red);color:#fff;font-size:11px;line-height:17px;text-align:center}
main{padding:14px;max-width:1500px;margin:0 auto;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
 margin-bottom:13px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
button{font:inherit;padding:8px 13px;border-radius:7px;border:1px solid var(--line);
 background:var(--panel);color:var(--ink);cursor:pointer;min-height:38px}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.sm{padding:5px 10px;font-size:12.5px;min-height:32px}
button.danger{color:var(--red);border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--greybg);text-align:left;padding:8px;border-bottom:2px solid var(--line);
 font-weight:700;font-size:12px;color:var(--muted);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)}.p-amber{background:var(--amberbg);color:var(--amber)}
.p-green{background:var(--greenbg);color:var(--green)}.p-grey{background:var(--greybg);color:var(--grey)}
.alert{border-left:4px solid var(--red);background:var(--redbg);padding:10px 12px;border-radius:7px;margin-bottom:8px}
.alert.amber{border-left-color:var(--amber);background:var(--amberbg)}
.alert b{display:block;margin-bottom:2px}.alert .why{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:11px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;margin-top:2px;color:var(--navy)}
.stat .v.bad{color:var(--red)}
label{display:block;font-size:12.5px;color:var(--muted);margin:9px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;
 background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:66px;resize:vertical}
dialog{border:none;border-radius:12px;padding:0;max-width:720px;width:94%;
 background:var(--panel);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,15,20,.6)}
dialog .hd{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy)}
dialog .bd{padding:16px;max-height:66vh;overflow:auto}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.muted{color:var(--muted);font-size:12.5px}.sm{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate{display:flex;gap:8px;padding:9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;align-items:flex-start;flex-wrap:wrap}
.gate .q{flex:1;min-width:200px}.gate select{width:auto;min-width:98px}
.q-no{font-weight:700;color:var(--muted);min-width:22px}
.note{background:var(--amberbg);border-left:4px solid var(--amber);padding:10px 12px;
 border-radius:7px;font-size:12.5px;margin-bottom:12px}
.empty{text-align:center;padding:26px;color:var(--muted);font-size:13px}
/* 鎖定畫面 */
#lock{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:200;
 display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:var(--panel);color:var(--ink);border-radius:14px;padding:26px;
 width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lock h2{margin:0 0 4px;color:var(--navy);font-size:19px}
#lock .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
#lock input{font-size:16px;padding:11px}
#lock button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:700}
#lock .err{color:var(--red);font-size:13px;margin-top:9px;min-height:19px}
#lock .warn{background:var(--amberbg);color:var(--amber);padding:9px 11px;border-radius:7px;
 font-size:12px;margin-top:14px;line-height:1.5}
.hide{display:none!important}
@media print{header,nav,button,.noprint,#lock{display:none!important}
 body{background:#fff}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h2 id="lkTitle">解鎖</h2>
    <div class="sub" id="lkSub">請輸入密碼</div>
    <input type="password" id="lkPw" autocomplete="current-password" placeholder="密碼"
      onkeydown="if(event.key==='Enter')lkGo()">
    <input type="password" id="lkPw2" class="hide" autocomplete="new-password" placeholder="再輸入一次"
      style="margin-top:8px" onkeydown="if(event.key==='Enter')lkGo()">
    <button class="pri" onclick="lkGo()" id="lkBtn">解鎖</button>
    <div class="err" id="lkErr"></div>
    <div class="warn">
      <b>資料以 AES-256-GCM 加密後才寫入裝置。</b><br>
      密碼不會被儲存、也無法找回——<b>忘記密碼＝資料永久無法還原</b>。
      請把密碼另外記在安全的地方。
    </div>
  </div>
</div>

<header class="hide" id="hdr">
  <h1>ALLO2 專案管理</h1>
  <span class="tag">🔒 加密</span>
  <span class="sp"></span>
  <button onclick="exportEnc()" title="加密備份，可放雲端">匯出</button>
  <button onclick="document.getElementById('imp').click()">匯入</button>
  <input type="file" id="imp" accept=".json,.enc" style="display:none" onchange="importFile(this)">
  <button onclick="lockNow()" title="鎖定">🔒</button>
  <button onclick="toggleTheme()">☾</button>
</header>

<nav id="nav" class="hide"></nav>
<main id="main" class="hide"></main>

<dialog id="dlg">
  <div class="hd" id="dlgTitle"></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft">
    <button onclick="document.getElementById('dlg').close()">取消</button>
    <button class="pri" id="dlgSave">儲存</button>
  </div>
</dialog>

<script>
/* ════════════════════════════════════════════════════════════════
   ALLO2 專案管理｜加密版
   · 資料以 AES-256-GCM 加密，金鑰由密碼經 PBKDF2-SHA256 推導
   · 迭代 310,000 次、每次加密使用隨機 salt 與 IV
   · 密碼不儲存、不傳送。無法找回
   · 完全離線：無 CDN、無外部資源、無任何網路請求
   · 程式碼本身不含任何客戶資料，可安全放置於雲端
   ════════════════════════════════════════════════════════════════ */

const KEY='allo2pm_enc_v2', ITER=310000, IDLE_MIN=15;
const enc=new TextEncoder(), dec=new TextDecoder();
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

let CKEY=null, DB=null, idleTimer=null;

/* ── 加密層 ── */
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptDB(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {v:2,iv:b64(iv),ct:b64(ct)};
}
async function decryptDB(pkg,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(pkg.iv)},key,ub64(pkg.ct));
  return JSON.parse(dec.decode(pt));
}
function getStore(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
async function save(){
  if(!CKEY||!DB)return;
  const st=getStore();
  const pkg=await encryptDB(DB,CKEY);
  localStorage.setItem(KEY,JSON.stringify({salt:st.salt,...pkg}));
}

/* ── 鎖定／解鎖 ── */
function lkMsg(t){document.getElementById('lkErr').textContent=t}
async function lkGo(){
  const pw=document.getElementById('lkPw').value;
  if(pw.length<8)return lkMsg('密碼至少 8 個字元');
  const st=getStore();
  document.getElementById('lkBtn').disabled=true; lkMsg('處理中…');
  try{
    if(!st){
      const pw2=document.getElementById('lkPw2').value;
      if(pw!==pw2){document.getElementById('lkBtn').disabled=false;return lkMsg('兩次輸入的密碼不一致')}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      CKEY=await deriveKey(pw,salt);
      DB={projects:[],contracts:[],evidence:[],decisions:[],watch:[],dd:[]};
      const pkg=await encryptDB(DB,CKEY);
      localStorage.setItem(KEY,JSON.stringify({salt:b64(salt),...pkg}));
      unlock(); dlgFirstRun();
    }else{
      CKEY=await deriveKey(pw,ub64(st.salt));
      DB=await decryptDB(st,CKEY);
      unlock();
    }
  }catch(e){
    CKEY=null;DB=null;
    lkMsg('密碼錯誤，或資料已損毀');
  }
  document.getElementById('lkBtn').disabled=false;
}
function unlock(){
  document.getElementById('lkPw').value='';
  document.getElementById('lkPw2').value='';
  lkMsg('');
  ['lock'].forEach(i=>document.getElementById(i).classList.add('hide'));
  ['hdr','nav','main'].forEach(i=>document.getElementById(i).classList.remove('hide'));
  resetIdle(); render();
}
function lockNow(){
  CKEY=null;DB=null;
  ['hdr','nav','main'].forEach(i=>document.getElementById(i).classList.add('hide'));
  document.getElementById('lock').classList.remove('hide');
  document.getElementById('lkPw').focus();
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{if(CKEY){alert('閒置超過 '+IDLE_MIN+' 分鐘，已自動鎖定。');lockNow()}},IDLE_MIN*60000);
}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(CKEY)resetIdle()},{passive:true}));

function initLock(){
  const st=getStore();
  if(!st){
    document.getElementById('lkTitle').textContent='設定密碼';
    document.getElementById('lkSub').textContent='第一次使用，請設定一組密碼（至少 8 字元）';
    document.getElementById('lkPw2').classList.remove('hide');
    document.getElementById('lkBtn').textContent='建立';
  }
  document.getElementById('lkPw').focus();
}

function dlgFirstRun(){
  dlg('資料庫已建立',`
   <p>目前是空的資料庫。你可以：</p>
   <ul style="padding-left:20px;line-height:2">
     <li><b>匯入既有資料</b>：點右上角「匯入」，載入 <code>初始資料.json</code> 或先前的加密備份</li>
     <li><b>從頭建立</b>：到各分頁逐筆新增</li>
   </ul>
   <div class="note" style="margin-top:12px">
     <b>請立刻做一件事：</b>把密碼記在密碼管理器或其他安全位置。
     本程式不儲存密碼，<b>遺失即無法還原</b>。</div>`,
   ()=>{});
  document.getElementById('dlgSave').textContent='知道了';
}

/* 題庫改由資料檔提供——線上這份程式碼不含任何題目內容 */
const GATE_OPT=['未評','通過','有條件','不通過'];
const GATES=()=>(DB&&DB.gatesDef)||[];
const DDQ=()=>(DB&&DB.ddqDef)||[];

/* ── 警示引擎 ── */
function alerts(){
  const out=[];
  (DB.contracts||[]).forEach(c=>{
    const p=(DB.projects||[]).find(x=>x.id===c.pid), pn=p?p.name:'（未指定專案）';
    if(!c.signed)out.push({lv:'red',t:`${c.title}｜尚未簽署`,w:`${pn}　${c.extNote||''}`});
    if(c.end){const d=days(c.end);
      if(d<0&&!c.extWritten)out.push({lv:'red',t:`${c.title}｜合約已於 ${c.end} 到期，且無書面展延`,
        w:`${pn}　逾期 ${-d} 天。展延未以書面確認者，法律上不生效力。`});
      else if(d<0)out.push({lv:'amber',t:`${c.title}｜已過原到期日 ${c.end}（已有書面展延）`,w:pn});
      else if(d<=30)out.push({lv:'amber',t:`${c.title}｜${d} 天後到期（${c.end}）`,w:pn});}
    (c.ms||[]).forEach(m=>{
      if(m.st==='未付'&&m.due&&m.due!=='—'&&days(m.due)<0)
        out.push({lv:'red',t:`${c.title}｜${m.n} 逾期未付`,
          w:`${pn}　應付日 ${m.due}（逾期 ${-days(m.due)} 天）　${m.amt}　條件：${m.cond}`});});
  });
  (DB.watch||[]).forEach(w=>{
    const due=w.last?new Date(new Date(w.last).getTime()+w.freq*864e5).toISOString().slice(0,10):null;
    if(due&&days(due)<0)out.push({lv:'amber',t:`監看逾期：${w.label}`,
      w:`上次檢查 ${w.last}，每 ${w.freq} 天應複查一次`});});
  const o={red:0,amber:1};return out.sort((a,b)=>o[a.lv]-o[b.lv]);
}

const TABS=[['dash','總覽'],['proj','專案'],['contract','合約與期限'],['gate','法域閘門'],

    `<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}${k==='dash'&&nRed?`<span class="n">${nRed}</span>`:''}</button>`).join('');

   <td class="sm muted">${esc(w.note)}</td>
   <td class="noprint"><button class="sm" onclick="tick('${w.id}')">今日已查</button>
    <button class="sm" onclick="edWatch('${w.id}')">編輯</button></td></tr>`}).join('')
   ||'<tr><td colspan="6" class="empty">尚無項目</td></tr>'}
  </tbody></table></div></div>`;
}
function tick(id){const w=DB.watch.find(x=>x.id===id);w.last=today();save();render()}
function edWatch(id){
  const w=id?DB.watch.find(x=>x.id===id):{id:uid(),label:'',freq:30,last:today(),note:''};
  dlg(id?'編輯監看項':'新增監看項',`
   <label>項目</label><input id="f_label" value="${esc(w.label)}">
   <label>頻率（天）</label><input type="number" id="f_freq" value="${w.freq}">
   <label>上次檢查</label><input type="date" id="f_last" value="${esc(w.last)}">
   <label>備註</label><textarea id="f_note">${esc(w.note)}</textarea>
   ${id?`<div style="margin-top:14px"><button class="danger sm" onclick="delItem('watch','${id}')">刪除</button></div>`:''}`,
   ()=>{Object.assign(w,{label:v('f_label'),freq:+v('f_freq')||30,last:v('f_last'),note:v('f_note')});
     if(!id)(DB.watch=DB.watch||[]).push(w);save();render()});
}

function v(id){return document.getElementById(id).value}
function dlg(title,body,onSave){
  document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgBody').innerHTML=body;
  const s=document.getElementById('dlgSave');
  const n=s.cloneNode(true);n.textContent='儲存';s.parentNode.replaceChild(n,s);
  n.onclick=()=>{onSave();document.getElementById('dlg').close()};
  document.getElementById('dlg').showModal();
}
function delItem(coll,id){
  if(!confirm('確定刪除？此動作無法復原。'))return;
  DB[coll]=DB[coll].filter(x=>x.id!==id);save();
  document.getElementById('dlg').close();render();
}
async function exportEnc(){
  const st=getStore();const pkg=await encryptDB(DB,CKEY);
  const out={app:'ALLO2PM',v:2,enc:true,salt:st.salt,iv:pkg.iv,ct:pkg.ct,at:new Date().toISOString()};
  dl(JSON.stringify(out,null,2),`ALLO2專案管理_加密備份_${today()}.json`);
}
function exportPlain(){
  if(!confirm('未加密版為明文，任何人取得即可閱讀全部內容。\n僅在確有必要時使用。確定匯出？'))return;
  dl(JSON.stringify(DB,null,2),`ALLO2專案管理_明文_${today()}.json`);
}
function dl(text,name){
  const b=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importFile(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.enc){
        const pw=prompt('此為加密備份。請輸入該備份的密碼：');
        if(!pw){inp.value='';return}
        const k=await deriveKey(pw,ub64(d.salt));
        const obj=await decryptDB({iv:d.iv,ct:d.ct},k);
        if(!confirm('匯入將覆蓋目前所有資料，確定？')){inp.value='';return}
        DB=obj;await save();render();alert('已匯入。');
      }else{
        if(!d.projects)throw new Error('檔案格式不符');
        if(!confirm('此為未加密檔案。匯入將覆蓋目前所有資料，確定？')){inp.value='';return}
        DB=d;await save();render();alert('已匯入，並已以你目前的密碼加密儲存。');
      }
    }catch(e){alert('匯入失敗：'+(e.message||'密碼錯誤或檔案損毀'))}
    inp.value='';
  };
  r.readAsText(f);
}
async function changePw(){
  const a=prompt('請輸入新密碼（至少 8 字元）');if(!a)return;
  if(a.length<8)return alert('密碼至少 8 個字元');
  const b=prompt('請再輸入一次新密碼');if(a!==b)return alert('兩次輸入不一致');
  const salt=crypto.getRandomValues(new Uint8Array(16));
  CKEY=await deriveKey(a,salt);
  const pkg=await encryptDB(DB,CKEY);
  localStorage.setItem(KEY,JSON.stringify({salt:b64(salt),...pkg}));
  alert('密碼已變更。請重新做一次備份——舊的備份檔仍須用舊密碼開啟。');
}
function wipe(){
  if(!confirm('將清除本機全部資料與密碼設定，且無法復原。確定？'))return;
  if(!confirm('再次確認：所有專案、合約、證據、決策紀錄都會消失。'))return;
  localStorage.removeItem(KEY);location.reload();
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('allo2pm_theme',next)}catch(e){}
}
try{const t=localStorage.getItem('allo2pm_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}

}else{initLock()}
