<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碳市場資料庫｜Clouding Media</title>
<meta name="description" content="全球自願碳市場登記處資料與每日情報。專案、國家、開發商、交付率分析。">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="stylesheet" href="styles.css?v=20261012b">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Playfair+Display:wght@500;600;700&family=Open+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<script src="i18n.js?v=20261012a"></script>
<style>
/* ── 語言 ── */
html[lang="my"] body,html[lang="my"] h1,html[lang="my"] h2,html[lang="my"] h3,
html[lang="my"] .lead,html[lang="my"] .brand{
  font-family:"Noto Sans Myanmar","Myanmar Text","Padauk",var(--sans);
  line-height:1.95;
}
html[lang="my"] .dbnav a,html[lang="my"] table.dt,html[lang="my"] .news h4{line-height:1.8}


#mapc{height:560px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sand)}
@media(max-width:900px){#mapc{height:420px}}
.leaflet-container{font:14px var(--sans);background:var(--sand)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:12px 0 0;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.mpop{font:14px var(--sans);line-height:1.6;max-width:260px}
.mpop b{display:block;margin-bottom:4px}
.mpop .mt{color:#5d6b78;font-size:12.5px}

/* ── 資料庫專屬 ── */
.db{display:grid;grid-template-columns:186px 1fr;gap:34px;align-items:start}
@media(max-width:900px){.db{grid-template-columns:1fr;gap:20px}}
.dbnav{position:sticky;top:94px}
@media(max-width:900px){.dbnav{position:static;display:flex;flex-wrap:wrap;gap:6px}}
.dbnav .grp{font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin:20px 0 8px}
@media(max-width:900px){.dbnav .grp{width:100%;margin:8px 0 2px}}
.dbnav a{display:block;padding:7px 11px;font-size:14.5px;color:var(--muted);
  text-decoration:none;border-left:2px solid transparent;cursor:pointer;border-radius:0 4px 4px 0}
.dbnav a:hover{color:var(--ink);background:var(--sand)}
.dbnav a.on{color:var(--brand);font-weight:600;border-left-color:var(--brand);background:var(--sand)}
@media(max-width:900px){.dbnav a{border:1px solid var(--line);border-radius:4px;padding:6px 12px}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:4px 0 30px}
.kpi{border-left:3px solid var(--brand);padding-left:16px}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.18;
  letter-spacing:-.3px;color:var(--brand)}
.kpi .k{font-size:13.5px;color:var(--muted);margin-top:3px}
.kpi.hl{border-left-color:var(--warn)}
.kpi.hl .v{color:var(--warn)}

.block{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:22px 24px;margin-bottom:22px}
.block h3{font-size:16px;margin:0 0 14px;color:var(--ink)}
.block .note{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:12px}

table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt th{text-align:left;font-weight:700;color:var(--muted);font-size:12.5px;
  letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;user-select:none}
table.dt th:hover{color:var(--ink)}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover td{background:var(--sand)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pct{font-weight:700}
.pct.lo{color:#a83232}.pct.md{color:var(--warn)}.pct.hi{color:var(--accent)}
.clickrow{cursor:pointer}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl input,.ctl select{font:14.5px var(--sans);padding:8px 12px;border:1px solid var(--line);
  border-radius:4px;background:var(--paper);color:var(--ink)}
.ctl input[type=search]{min-width:260px;flex:1;max-width:380px}

.spark{display:flex;align-items:flex-end;gap:2px;height:52px}
.spark i{flex:1;background:var(--brand);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.spark i:hover{opacity:1}
.sparkx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}

.bars b{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px;font-weight:400}
.bars .l{width:190px;flex:0 0 190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{flex:1;height:8px;background:var(--sand);border-radius:4px;overflow:hidden}
.bars .fl{height:100%;background:var(--grad);border-radius:4px}
.bars .nn{width:70px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.news{border-top:1px solid var(--line)}
.news article{padding:16px 0;border-bottom:1px solid var(--line)}
.news h4{margin:0 0 5px;font-size:15.5px;font-weight:600;line-height:1.5}
.news h4 a{text-decoration:none}
.news h4 a:hover{color:var(--accent)}
.news .meta{font-size:12.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.news .d{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6}
.cat{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;font-weight:600}
.cat-標準{background:var(--accent-soft);color:var(--accent)}
.cat-市場{background:#eaf0f7;color:var(--navy)}
.cat-法規{background:#f0ecf7;color:#5a4a8a}
.cat-完整性{background:var(--warn-soft);color:var(--warn)}
.cat-專案{background:#eaf1ed;color:#2d6a4f}
.cat-科學{background:#eef1f3;color:#4a5a68}
.cat-其他,.cat-一般{background:var(--sand);color:var(--muted)}
.tg{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;
  border:1px solid var(--line);color:var(--muted)}
.more{display:inline-block;margin-top:14px;font-size:14.5px;color:var(--accent);
  cursor:pointer;font-weight:600}
.more:hover{text-decoration:underline}
.loading{color:var(--muted);padding:50px 0;text-align:center}
.pwrap{max-width:320px;height:6px;margin:14px auto 8px;background:var(--sand);border-radius:3px;overflow:hidden}
.pwrap i{display:block;height:100%;width:0;background:var(--grad);border-radius:3px;transition:width .2s}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}

/* ── 儀表板 ── */
.kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:4px 0 24px}
.kpi2{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);padding:17px 19px 16px;display:flex;flex-direction:column;gap:3px}
.kpi2 .kv{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.15;
  color:var(--brand);letter-spacing:-.3px}
.kpi2 .kk{font-size:13px;color:var(--muted)}
.kpi2 .kb{position:absolute;left:0;top:0;bottom:0;width:4px}

.qpanel{border:1px solid var(--line);border-radius:10px;background:var(--sand);
  padding:22px 24px;margin-bottom:24px}
.qh{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:9px}
.qbtn{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:7px;background:var(--paper);
  padding:11px 13px;font:600 13.5px/1.5 var(--sans);color:var(--ink);
  transition:box-shadow .16s,border-color .16s}
.qbtn:hover{box-shadow:0 3px 12px rgba(0,109,167,.1);border-color:#cfe0e9;color:var(--brand)}
.qbtn .qd{width:9px;height:9px;border-radius:3px;flex:0 0 auto}

.nlead .nlt{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.45;margin:0 0 8px}
.nlead .nlt a{color:var(--ink);text-decoration:none}
.nlead .nlt a:hover{color:var(--brand)}
.nlead .nld{font-size:14.5px;color:var(--muted);line-height:1.75;margin:10px 0 0;max-width:72ch}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;
  margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.ngrid h4{margin:0 0 5px;font-size:14.5px;font-weight:600;line-height:1.5}
.ngrid h4 a{color:var(--ink);text-decoration:none}
.ngrid h4 a:hover{color:var(--brand)}
.ngrid .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

/* ── 碳權百科 ── */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}
.wcard{display:flex;flex-direction:column;gap:5px;cursor:pointer;text-decoration:none;
  border:1px solid var(--line);border-radius:9px;padding:15px 17px;background:var(--paper);
  transition:box-shadow .16s,border-color .16s}
.wcard:hover{box-shadow:0 4px 16px rgba(0,109,167,.1);border-color:#cfe0e9}
.wcard .wt{font-size:15.5px;font-weight:700;color:var(--brand);line-height:1.4}
.wcard .ws{font-size:13px;color:var(--muted);line-height:1.6}
.wbody{max-width:66ch}
.wbody p{font-size:15.5px;line-height:1.95;margin:0 0 16px;color:var(--sec)}
.wsrc{list-style:none;margin:0;padding:0}
.wsrc li{margin-bottom:7px;font-size:14px}
.wsrc a{color:var(--brand);text-decoration:none}
.wsrc a:hover{text-decoration:underline}
.wnav{display:flex;justify-content:space-between;gap:16px;margin-top:26px;
  padding-top:18px;border-top:1px solid var(--line);font-size:14px}
.wnav a{color:var(--brand);cursor:pointer;text-decoration:none;max-width:45%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wnav a:hover{text-decoration:underline}

/* ── 機構卡片 ── */
.ocard .oav{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;
  font-family:var(--serif);font-size:30px;font-weight:700;color:rgba(255,255,255,.95);
  letter-spacing:1px;position:relative}
.ocard .oav::after{content:"";position:absolute;inset:0;opacity:.26;
  background-image:radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:8px 8px}
.ocard .pchips .flg{width:20px;height:15px}

/* ── 國家索引版面 ── */
.r4grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:0 0 26px}
.r4card{position:relative;overflow:hidden;text-align:left;cursor:pointer;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);padding:17px 19px 16px;
  display:flex;flex-direction:column;gap:4px;font-family:var(--sans);
  transition:box-shadow .16s,border-color .16s}
.r4card:hover{box-shadow:0 4px 16px rgba(0,109,167,.1);border-color:#cfe0e9}
.r4card .r4n{font-size:16px;font-weight:700;color:var(--ink)}
.r4card .r4m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.r4card .r4b{position:absolute;left:0;top:0;bottom:0;width:4px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
.ccard{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--paper);
  transition:box-shadow .16s,border-color .16s}
.ccard:hover{box-shadow:0 4px 16px rgba(0,109,167,.1);border-color:#cfe0e9}
.ccard .cc{display:flex;flex-direction:column;min-width:0}
.ccard .cn2{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .cm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.flg{width:26px;height:20px;object-fit:cover;border-radius:3px;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(0,0,0,.12);display:inline-block;vertical-align:middle}
.flg.nf{width:26px;height:20px;background:var(--sand);color:var(--muted);font-size:10px;
  font-weight:700;text-align:center;line-height:20px;letter-spacing:.3px}
table.dt .flg{margin-right:8px}
@media(max-width:700px){.cgrid{grid-template-columns:1fr}.r4grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}

/* ── 專案探索版面 ── */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px}
.ptabs button{font:600 14.5px var(--sans);padding:9px 16px;border:none;background:none;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-bottom:38px}
.theme{position:relative;overflow:hidden;border:none;cursor:pointer;border-radius:10px;
  min-height:96px;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:flex-start;text-align:left;color:#fff;font-family:var(--sans)}
.theme::after{content:"";position:absolute;inset:0;opacity:.3;
  background-image:radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1px);
  background-size:9px 9px}
.theme:hover{filter:brightness(1.08)}
.theme .tn{position:relative;z-index:1;font-size:15.5px;font-weight:700;line-height:1.35}
.theme .tc{position:relative;z-index:1;font-size:12.5px;opacity:.85;margin-top:3px;
  font-variant-numeric:tabular-nums}

.catsec{margin-bottom:34px}
.cathead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.cathead .cdot{width:13px;height:13px;border-radius:4px;flex:0 0 auto}
.cathead h3{margin:0;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.cathead h3:hover{color:var(--brand)}
.cathead .cn{font-size:12.5px;color:var(--muted);background:var(--sand);
  padding:1px 8px;border-radius:9px;font-variant-numeric:tabular-nums}
.cathead .sp{flex:1}
.arw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0}
.arw:hover{border-color:var(--brand);color:var(--brand)}

.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:218px;gap:14px;
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.scroller::-webkit-scrollbar{height:7px}
.scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:11px}
.pcard{display:flex;gap:13px;text-decoration:none;cursor:pointer;
  scroll-snap-align:start;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--paper);padding:11px;transition:box-shadow .16s,border-color .16s}
.pcard:hover{box-shadow:0 5px 18px rgba(0,109,167,.11);border-color:#cfe0e9}
.pth{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:7px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth{background-size:cover;background-position:center}
.pth.ok .piso{display:none}
.pth .piso{position:static;font-family:var(--serif);font-size:21px;font-weight:700;
  color:rgba(255,255,255,.92);letter-spacing:.5px;line-height:1}
.pbody{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.ptitle{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;padding:0;min-height:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pdev{font-size:12.5px;color:var(--muted);padding:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:4px 0 0}
.pchips em{font-style:normal;font-size:11px;background:var(--sand);color:var(--muted);
  border:1px solid var(--line);padding:1px 7px;border-radius:3px;max-width:140px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchips em.ct{border-color:transparent;color:#fff;background:var(--g,var(--brand))}
.pchips .flg{width:18px;height:13px}
/* 機構卡維持直式（縮圖是字首徽章，沒有衛星影像） */
.ocard{flex-direction:column;gap:0;padding:0}
.ocard .ptitle{padding:11px 13px 0;min-height:44px}
.ocard .pdev{padding:4px 13px 0}
.ocard .pchips{padding:9px 13px 12px}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}
  .scroller{grid-auto-columns:176px}.themes{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.src{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:28px;
  padding-top:16px;border-top:1px solid var(--line)}
</style>
<script src="lang.js?v=20261012b" defer></script>
</head>
<body>

<header>
<div class="wrap">
  <nav class="nav" id="nav">
    <a class="brand" href="index.html"><img src="images/logo-lockup-white.png" alt="FOREST AIR"></a>
    <button class="burger" onclick="document.getElementById('nav').classList.toggle('open')">選單</button>
    <span class="sp"></span>
    <a class="lk" href="index.html">首頁</a>
    <a class="lk" href="services.html">服務</a>
    <a class="lk on" href="data.html">資料庫</a>
    <a class="lk" href="about.html">關於</a>
    <a class="lk" href="contact.html">聯絡</a>
    <a class="cta" href="contact.html">聯絡我們</a>
    <span class="langbar" id="langbar"></span>
  </nav>
</div>
</header>

<div class="hero" style="padding:62px 0 42px">
<div class="wrap">
  <div class="rule"></div>
  <div class="eyebrow">Carbon Market Database</div>
  <h1 id="hh1" style="font-size:clamp(26px,4vw,40px);margin-bottom:12px">碳市場資料庫</h1>
  <p class="lead" id="hlead" style="margin-bottom:0">
    全球自願碳市場的登記處資料與每日情報。可依國家、專案類型、開發商翻閱，
    並檢視我們自行計算的交付率——事前預估與實際核發之間的落差。
  </p>
</div>
</div>

<section class="tight">
<div class="wrap">
<div class="db">

  <aside class="dbnav">
    <div class="grp">瀏覽</div>
    <a data-v="dash" class="on">總覽</a>
    <a data-v="countries">國家</a>
    <a data-v="projects">專案</a>
    <a data-v="devs">開發商</a>
    <a data-v="map">地圖</a>
    <div class="grp">分析</div>
    <a data-v="delivery">交付率</a>
    <a data-v="methods">方法學</a>
    <div class="grp">情報</div>
    <a data-v="pulse">每日動態</a>
    <div class="grp">參考</div>
    <a data-v="wiki">碳權百科</a>
  </aside>

  <div id="view"><div class="loading" id="boot">載入資料中…</div></div>

</div>
</div>
</section>

<footer>
<div class="wrap">
  <div class="small muted">
    © <span id="yr"></span> 奧森氧整合科技國際股份有限公司 ｜ Clouding Media
  </div>
</div>
</footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();

let LANG=(localStorage.getItem('cmlang')||(navigator.language||'').slice(0,2).replace('zh','zh'))||'zh';
if(!window.I18N[LANG])LANG='zh';
const T=(k,v)=>{let x=(window.I18N[LANG]||{})[k]; if(x==null)x=(window.I18N.zh||{})[k]; if(x==null)return k;
  if(v)Object.keys(v).forEach(n=>x=x.split('{'+n+'}').join(v[n])); return x;};
const TC=c=>((window.I18N[LANG]||{}).cat||{})[c]||c;
const TG=g=>((window.I18N[LANG]||{}).tag||{})[g]||g;
function setLang(l){LANG=l;localStorage.setItem('cmlang',l);document.documentElement.lang=l;
  document.title=T('title');applyStatic();buildSw();render();}
function buildSw(){if(window.LangBar)window.LangBar.draw();}
function applyStatic(){
  const set=(sel,k)=>{const e=document.querySelector(sel);if(e)e.textContent=T(k)};
  set('#hh1','h1'); set('#hlead','lead');
  document.querySelectorAll('.dbnav a[data-v]').forEach(a=>a.textContent=T(a.dataset.v));
  document.querySelectorAll('.dbnav .grp').forEach((g,i)=>g.textContent=T(['nav_browse','nav_analysis','nav_intel','nav_ref'][i]));
}
window.setLang=setLang;

const S={p:[],c:[],meta:null,news:null,view:'dash',sel:null,q:'',fr:'',fs:'',fc:'',fg:'good',
         sort:{k:'i',d:-1},lim:60};
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const big=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':Math.round(n);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pc=v=>v==null?'':v<25?'lo':v<60?'md':'hi';
const ago=ts=>{if(!ts)return'';const h=(Date.now()/1000-ts)/3600;
  return h<1?'剛剛':h<24?Math.round(h)+' 小時前':Math.round(h/24)+' 天前'};

function spark(sr){
  if(!sr||!sr.length)return'<div class="note">無年度資料</div>';
  const mx=Math.max(...sr.map(x=>x[1]))||1;
  return'<div class="spark">'+sr.map(x=>`<i style="height:${Math.max(1,x[1]/mx*100)}%" title="${x[0]}：${fmt(x[1])}"></i>`).join('')
    +`</div><div class="sparkx"><span>${sr[0][0]}</span><span>${sr[sr.length-1][0]}</span></div>`;
}
function bars(o,m){
  const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,m||8);
  if(!e.length)return'<div class="note">—</div>';
  const mx=e[0][1];
  return'<div class="bars">'+e.map(([k,v])=>`<b><span class="l" title="${esc(k)}">${esc(k)}</span>
    <span class="tr"><span class="fl" style="width:${v/mx*100}%"></span></span>
    <span class="nn">${fmt(v)}</span></b>`).join('')+'</div>';
}

const V={};
S.pmode='disc';S.fth=null;S.fcat='';S.cmode='ix';S.rexp=null;S.dmode='disc';S.dkind='dev';S.dcat='';S.wiki=null;

// 快速入口：以「想知道什麼」出發，而不是以資料表出發
const QUICK = [
  ['q_where',  'go("countries")',                              '#0b5c86,#2a9fd0'],
  ['q_forest', 'dcatJump("Forestry & Land Use")',              '#15603f,#3f9e6e'],
  ['q_deliver','go("delivery")',                               '#7a5a1a,#c49a3a'],
  ['q_who',    'go("devs")',                                   '#5c4a86,#9281c4'],
  ['q_method', 'go("methods")',                                '#1f6b66,#46a8a0'],
  ['q_map',    'go("map")',                                    '#46525f,#828f9d'],
  ['q_learn',  'go("wiki")',                                   '#006DA7,#009F7C'],
  ['q_news',   'go("pulse")',                                  '#7d3f55,#bd7a90']
];
function dcatJump(c) { S.view = 'projects'; S.pmode = 'all'; S.fcat = c; S.fth = null; S.q = ''; S.lim = 60; render(); window.scrollTo(0, 0); }

V.dash = () => {
  const m = S.meta, reg = {}, cat = {}, vint = {};
  S.p.forEach(p => { if (p.r) reg[p.r] = (reg[p.r] || 0) + p.i; if (p.cat) cat[p.cat] = (cat[p.cat] || 0) + p.i; });
  S.c.forEach(c => (c.vint || []).forEach(([y, q]) => vint[y] = (vint[y] || 0) + q));
  const news = (S.news && S.news.items) || [];
  const lead = news.filter(x => x.rel)[0];
  const rest = news.filter(x => x.rel && x !== lead).slice(0, 6);
  // 各國的 devs 加總會把跨國開發商重複計算，改用 meta 的不重複數
  const devs = m.devs || S.c.reduce((s, c) => s + (c.devs || 0), 0);

  const kpi = (v, k, g) => `<div class="kpi2"><span class="kv">${v}</span><span class="kk">${k}</span>
    <span class="kb" style="background:linear-gradient(135deg,${g})"></span></div>`;

  return `<div class="kpis2">
      ${kpi(m.projects.toLocaleString(), T('k_projects'), '#0b5c86,#2a9fd0')}
      ${kpi(fmt(devs), T('k_devs2'), '#5c4a86,#9281c4')}
      ${kpi(m.countries, T('k_countries'), '#15603f,#3f9e6e')}
      ${kpi(big(m.issued), T('k_issued'), '#7a5a1a,#c49a3a')}
    </div>

    <div class="qpanel">
      <div class="qh">${T('q_head')}</div>
      <div class="qgrid">${QUICK.map(q =>
        `<button class="qbtn" onclick='${q[1]}'><span class="qd" style="background:linear-gradient(135deg,${q[2]})"></span>${T(q[0])}</button>`
      ).join('')}</div>
    </div>

    ${lead ? `<div class="block nlead">
      <div class="eyebrow" style="margin-bottom:12px">${T('h_latest')}</div>
      <h3 class="nlt"><a href="${esc(lead.u)}" target="_blank" rel="noopener">${esc(lead.t)}</a></h3>
      <div class="meta"><span class="cat cat-${esc(lead.c)}">${esc(T('cat.' + lead.c) !== 'cat.' + lead.c ? T('cat.' + lead.c) : lead.c)}</span>
        <span>${esc(lead.s)}</span><span>${ago(lead.ts)}</span></div>
      ${lead.d ? `<div class="nld">${esc(lead.d)}</div>` : ''}
      <div class="ngrid">${rest.map(x => `<article>
        <h4><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a></h4>
        <div class="meta"><span>${esc(x.s)}</span><span>${ago(x.ts)}</span></div>
      </article>`).join('')}</div>
      <span class="more" onclick="go('pulse')">${T('seeall')}</span>
    </div>` : ''}

    <div class="block"><h3>${T('h_vintage')}</h3>${spark(Object.entries(vint).map(([y, q]) => [+y, q]).sort((a, b) => a[0] - b[0]))}</div>

    <div class="grid g2" style="gap:22px">
      <div class="block"><h3>${T('h_byreg')}</h3>${S.p.length ? bars(reg) : `<div class="note">${T('loadp')}</div>`}</div>
      <div class="block"><h3>${T('h_bycat')}</h3>${S.p.length ? bars(cat, 8) : `<div class="note">${T('loadp')}</div>`}</div>
    </div>

    <div class="block"><h3>${T('h_top12')}</h3>
      <table class="dt"><thead><tr><th>${T('t_country')}</th><th>${T('t_region')}</th>
        <th class="n">${T('t_proj')}</th><th class="n">${T('t_issued')}</th><th class="n">${T('t_delivery')}</th></tr></thead>
      <tbody>${S.c.slice(0, 12).map(c => `<tr class="clickrow" onclick="go('country','${esc(c.name)}')">
        <td>${c.iso ? flag(c.iso) : ''}<strong style="vertical-align:middle">${esc(c.name)}</strong></td>
        <td>${esc(c.r4) || '—'}</td>
        <td class="n">${fmt(c.n)}</td><td class="n">${fmt(c.issued)}</td>
        <td class="n pct ${pc(c.delivery)}">${c.delivery == null ? '—' : c.delivery + '%'}</td></tr>`).join('')}</tbody></table></div>`;
};

const R4 = [
  ['Asia-Pacific',         'r_ap',  '#0b5c86,#2a9fd0'],
  ['Africa',               'r_af',  '#15603f,#3f9e6e'],
  ['Americas',             'r_am',  '#7a5a1a,#c49a3a'],
  ['Europe & Middle East', 'r_em',  '#46525f,#828f9d'],
  ['International',        'r_int', '#5c4a86,#9281c4']
];
const flag = iso => iso
  ? `<img class="flg" src="images/flags/${iso.toLowerCase()}.png" alt="" loading="lazy" width="26" height="20" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flg nf',textContent:'${esc(iso)}'}))">`
  : '<span class="flg nf">—</span>';

function cmode(m) { S.cmode = m; S.lim = 60; render(); window.scrollTo(0, 0); }

function ccard(c) {
  return `<a class="ccard" onclick="go('country','${esc(c.name)}')" title="${esc(c.name)}">
    ${flag(c.iso)}
    <span class="cc">
      <span class="cn2">${esc(c.name)}</span>
      <span class="cm">${fmt(c.devs)} ${T('u_devs')} · ${fmt(c.n)} ${T('u_proj')}</span>
    </span>
  </a>`;
}

V.countries = () => {
  const groups = {};
  S.c.forEach(c => { (groups[c.r4 || 'International'] || (groups[c.r4 || 'International'] = [])).push(c); });

  const tabs = `<div class="ptabs">
    <button class="${S.cmode !== 'an' ? 'on' : ''}" onclick="cmode('ix')">${T('tab_index')}</button>
    <button class="${S.cmode === 'an' ? 'on' : ''}" onclick="cmode('an')">${T('tab_analytics')}</button>
  </div>`;

  const sum = `<div class="r4grid">${R4.filter(r => groups[r[0]] && r[0] !== 'International').map(r => {
    const g = groups[r[0]];
    return `<button class="r4card" onclick="document.getElementById('rg-${esc(r[0]).replace(/[^A-Za-z]/g,'')}').scrollIntoView({behavior:'smooth',block:'start'})">
      <span class="r4n">${T(r[1])}</span>
      <span class="r4m">${fmt(g.reduce((s,c)=>s+(c.devs||0),0))} ${T('u_devs')} · ${fmt(g.reduce((s,c)=>s+c.n,0))} ${T('u_proj')}</span>
      <span class="r4b" style="background:linear-gradient(135deg,${r[2]})"></span>
    </button>`;
  }).join('')}</div>`;

  return `<div class="crumb">${T('countries')}</div>` + sum + tabs +
    (S.cmode === 'an' ? cAnalytics() : cIndex(groups));
};

function cIndex(groups) {
  const q = S.q.toLowerCase();
  const search = `<div class="ctl"><input type="search" id="q" placeholder="${T('s_country')}" value="${esc(S.q)}">
    <span class="muted small">${S.c.length} ${T('u_countries')}</span></div>`;

  if (q) {
    const hit = S.c.filter(c => c.name.toLowerCase().includes(q) || (c.iso||'').toLowerCase() === q);
    return search + `<div class="cgrid">${hit.map(ccard).join('') || `<div class="loading">${T('none')}</div>`}</div>`;
  }

  return search + R4.filter(r => groups[r[0]]).map(r => {
    const g = [...groups[r[0]]].sort((a, b) => b.n - a.n);
    const id = 'rg-' + r[0].replace(/[^A-Za-z]/g, '');
    const shown = S.rexp === r[0] ? g : g.slice(0, 9);
    return `<div class="catsec" id="${id}">
      <div class="cathead">
        <span class="cdot" style="background:linear-gradient(135deg,${r[2]})"></span>
        <h3>${T(r[1])}</h3>
        <span class="cn">${g.length} ${T('u_countries')}</span>
        <span class="sp"></span>
        ${g.length > 9 ? `<span class="more" style="margin:0" onclick="S.rexp=${S.rexp===r[0]?'null':`'${esc(r[0])}'`};render()">${S.rexp===r[0]?T('collapse'):T('seeallp')}</span>` : ''}
      </div>
      <div class="cgrid">${shown.map(ccard).join('')}</div>
    </div>`;
  }).join('');
}

function cAnalytics() {
  const q = S.q.toLowerCase();
  const rows = S.c.filter(c => !q || c.name.toLowerCase().includes(q) || (c.r4 || '').toLowerCase().includes(q));
  const k = S.sort.k, d = S.sort.d;
  const sorted = [...rows].sort((a, b) => {
    const x = a[k], y = b[k];
    if (typeof x === 'number' || typeof y === 'number') return ((y || 0) - (x || 0)) * (d < 0 ? 1 : -1);
    return String(x || '').localeCompare(String(y || '')) * (d < 0 ? -1 : 1);
  });
  return `<div class="ctl"><input type="search" id="q" placeholder="${T('s_country')}" value="${esc(S.q)}">
    <span class="muted small">${sorted.length} ${T('u_countries')}</span></div>
  <div class="block"><table class="dt"><thead><tr>
    <th data-s="name">${T('t_country')}</th><th data-s="r4">${T('t_region')}</th>
    <th class="n" data-s="n">${T('t_proj')}</th><th class="n" data-s="devs">${T('t_devs')}</th>
    <th class="n" data-s="issued">${T('t_issued')}</th><th class="n" data-s="retired">${T('t_retired')}</th>
    <th class="n" data-s="delivery">${T('t_delivery')}</th></tr></thead>
  <tbody>${sorted.slice(0, S.lim).map(c => `<tr class="clickrow" onclick="go('country','${esc(c.name)}')">
    <td>${flag(c.iso)}<strong style="vertical-align:middle">${esc(c.name)}</strong></td>
    <td>${esc(c.r4) || '—'}</td>
    <td class="n">${fmt(c.n)}</td><td class="n">${fmt(c.devs)}</td>
    <td class="n">${fmt(c.issued)}</td><td class="n">${fmt(c.retired)}</td>
    <td class="n pct ${pc(c.delivery)}">${c.delivery == null ? '—' : c.delivery + '%'}</td></tr>`).join('')}</tbody></table>
  ${sorted.length > S.lim ? `<span class="more" onclick="S.lim+=80;render()">${T('more80')}</span>` : ''}</div>`;
}

V.country=()=>{
  const c=S.c.find(x=>x.name===S.sel);
  if(!c)return`<div class="loading">${T('notfound_c')}</div>`;
  const ps=S.p.filter(p=>p.c===c.name).sort((a,b)=>b.i-a.i);
  return `<div class="crumb"><a onclick="go('countries')">國家</a> / ${esc(c.region)||'—'} / ${esc(c.name)}</div>
  <h2 style="font-size:28px;margin-bottom:6px">${esc(c.name)}</h2>
  <p class="muted small" style="margin-bottom:22px">${c.n} 個專案，橫跨 ${Object.keys(c.regs).length} 個登記處</p>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(c.n)}</div><div class="k">${T('k_projects')}</div></div>
    <div class="kpi"><div class="v">${fmt(c.devs)}</div><div class="k">${T('k_devs')}</div></div>
    <div class="kpi"><div class="v">${big(c.issued)}</div><div class="k">${T('k_issued')}</div></div>
    ${c.delivery!=null?`<div class="kpi hl"><div class="v">${c.delivery}%</div><div class="k">交付率（${c.cmp_n} 案）</div></div>`:''}
  </div>
  ${c.delivery!=null?`<div class="block"><h3>${T('h_delivtbl')}</h3>
    <table class="dt"><tbody>
      <tr><td>事前預估累計（年預估 × 運行年數）</td><td class="n">${fmt(c.cmp_exp)}</td></tr>
      <tr><td>實際已核發</td><td class="n">${fmt(c.cmp_act)}</td></tr>
      <tr><td><strong>達成率</strong></td><td class="n pct ${pc(c.delivery)}"><strong>${c.delivery}%</strong></td></tr>
    </tbody></table>
    <div class="note">樣本：${c.cmp_n} 個同時具備「事前年預估」與「起始年」、且已運行滿 3 年的專案。
      此指標為本站自行計算，登記處不直接提供。會低估仍在爬坡期的專案，應作量級比較而非個案評價。</div></div>`:''}
  <div class="block"><h3>${T('h_vintage')}</h3>${spark(c.vint)}</div>
  <div class="block"><h3>登記處</h3>${bars(c.regs)}</div>
  <div class="block"><h3>專案類型</h3>${bars(c.types,10)}</div>
  <div class="block"><h3>專案（${ps.length}）</h3>
    <div class="ctl"><span class="more" onclick="csvProjects(S.p.filter(x=>x.c==='${esc(c.name)}'))">${T('csv')}</span></div>
    <table class="dt"><thead><tr><th>ID</th><th>${T('t_name')}</th><th>${T('t_registry')}</th><th>${T('t_type')}</th>
      <th class="n">${T('t_est')}</th><th class="n">${T('t_issued')}</th><th class="n">${T('t_rate')}</th></tr></thead>
    <tbody>${ps.slice(0,S.lim).map(p=>{
      const yr=p.fy?2026-p.fy:null,exp=(p.e&&yr&&yr>=3)?p.e*yr:null,d=exp?Math.round(1000*p.i/exp)/10:null;
      return `<tr class="clickrow" onclick="go('project','${esc(p.id)}')">
      <td><span class="pill">${esc(p.id)}</span></td><td>${esc(p.n)}</td>
      <td>${esc(p.r)}</td><td>${esc(p.t)||'—'}</td>
      <td class="n">${fmt(p.e)}</td><td class="n">${fmt(p.i)}</td>
      <td class="n pct ${pc(d)}">${d==null?'—':d+'%'}</td></tr>`}).join('')}</tbody></table>
    ${ps.length>S.lim?`<span class="more" onclick="S.lim+=80;render()">再顯示 80 筆</span>`:''}</div>`;
};

V.project=()=>{
  const p=S.p.find(x=>x.id===S.sel);
  if(!p)return`<div class="loading">${T('notfound_p')}</div>`;
  const yr=p.fy?2026-p.fy:null, exp=(p.e&&yr&&yr>=3)?p.e*yr:null;
  const d=exp?Math.round(1000*(p.i||0)/exp)/10:null;
  const peers=S.p.filter(x=>x.c===p.c&&x.t===p.t&&x.id!==p.id).sort((a,b)=>(b.i||0)-(a.i||0)).slice(0,6);
  const row=(k,v)=>v?`<tr><td style="color:var(--muted);width:34%">${k}</td><td>${v}</td></tr>`:'';
  return `<div class="crumb"><a onclick="go('projects')">專案</a>
    ${p.c?` / <a onclick="go('country','${esc(p.c)}')">${esc(p.c)}</a>`:''} / ${esc(p.id)}</div>
  <h2 style="font-size:23px;margin-bottom:6px;line-height:1.45">${esc(p.n)}</h2>
  <p class="muted small" style="margin-bottom:22px">
    <span class="pill">${esc(p.id)}</span> ${esc(p.r)}${p.s?' ｜ '+esc(p.s):''}</p>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(p.e)}</div><div class="k">事前年預估 tCO₂e</div></div>
    <div class="kpi"><div class="v">${fmt(p.i)}</div><div class="k">${T('k_issued')}</div></div>
    ${p.rt?`<div class="kpi"><div class="v">${fmt(p.rt)}</div><div class="k">已註銷</div></div>`:''}
    ${d!=null?`<div class="kpi hl"><div class="v">${d}%</div><div class="k">達成率（${yr} 年）</div></div>`:''}
  </div>
  <div class="block"><h3>${T('h_info')}</h3>
    <table class="dt"><tbody>
      ${row('國家',p.c?`<a onclick="go('country','${esc(p.c)}')" style="color:var(--accent);cursor:pointer">${esc(p.c)}</a>`:'')}
      ${row('地區',esc(p.rg))}${row('登記處',esc(p.r))}${row('狀態',esc(p.s))}
      ${row('範疇',esc(p.sc))}${row('類型',esc(p.t))}${row('減量／移除',esc(p.rr))}
      ${row('方法學',esc(p.m)+(p.mv?' '+esc(p.mv):''))}
      ${row('開發商',esc(p.d))}${row('查證機構',esc(p.vf))}
      ${row('起始年份',p.fy||'')}${row('地點',esc(p.l))}
    </tbody></table></div>
  ${d!=null?`<div class="block"><h3>${T('h_calc')}</h3>
    <table class="dt"><tbody>
      <tr><td>事前年預估</td><td class="n">${fmt(p.e)}</td></tr>
      <tr><td>運行年數（2026 − ${p.fy}）</td><td class="n">${yr}</td></tr>
      <tr><td>預估累計</td><td class="n">${fmt(exp)}</td></tr>
      <tr><td>實際已核發</td><td class="n">${fmt(p.i)}</td></tr>
      <tr><td><strong>達成率</strong></td><td class="n pct ${pc(d)}"><strong>${d}%</strong></td></tr>
    </tbody></table>
    <div class="note">本站自行計算。此法假設年預估在整個運行期間恆定，

// 只有真的定位到地點（site／place／admin）才放影像。僅有國家質心的
// 專案維持漸層底：那種縮放下的圖磚是「國家中央」而非案場，同一國
// 還會重複同一張，放上去只會誤導。
const TZ={site:12,place:11,admin:8};
function tileURL(ll,gp){
  const z=TZ[gp];
  if(!ll||!z)return null;
  const n=Math.pow(2,z);
  const la=Math.max(-85.05,Math.min(85.05,ll[0]))*Math.PI/180;
  let x=Math.floor((ll[1]+180)/360*n);
  let y=Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n);
  x=Math.max(0,Math.min(n-1,x));y=Math.max(0,Math.min(n-1,y));
  return 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/'+z+'/'+y+'/'+x+'.jpg';
}
// 捲到可視範圍才抓圖，並限制同時連線數，避免一次打爆圖磚服務
let TQ=[],TRUN=0;
function tpump(){
  while(TRUN<6&&TQ.length){
    const el=TQ.shift();if(!el.isConnected)continue;
    TRUN++;
    const img=new Image();
    img.onload=()=>{el.style.backgroundImage='url('+img.src+')';el.classList.add('ok');TRUN--;tpump();};
    img.onerror=()=>{TRUN--;tpump();};
    img.src=el.dataset.tile;
  }
}
const TOBS=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){TOBS.unobserve(e.target);TQ.push(e.target);}});
  tpump();
},{rootMargin:'300px'}):null;
function tileScan(){
  document.querySelectorAll('.pth[data-tile]:not(.q)').forEach(el=>{
    el.classList.add('q');
    if(TOBS)TOBS.observe(el);else{TQ.push(el);}
  });
  if(!TOBS)tpump();
}

let ORGS = null;

function buildOrgs() {
  if (ORGS) return ORGS;
  const mk = () => ({ n: 0, i: 0, cs: {}, cats: {}, regs: {} });
  const dev = {}, vrf = {}, reg = {};
  S.p.forEach(p => {
    if (p.d) {
      const a = dev[p.d] || (dev[p.d] = mk());
      a.n++; a.i += p.i || 0;
      if (p.c) a.cs[p.c] = (a.cs[p.c] || 0) + 1;
      if (p.cat) a.cats[p.cat] = (a.cats[p.cat] || 0) + 1;
      if (p.r) a.regs[p.r] = (a.regs[p.r] || 0) + 1;
    }
    if (p.vf) {
      const a = vrf[p.vf] || (vrf[p.vf] = mk());
      a.n++; a.i += p.i || 0;
      if (p.c) a.cs[p.c] = (a.cs[p.c] || 0) + 1;
      if (p.cat) a.cats[p.cat] = (a.cats[p.cat] || 0) + 1;
    }
    if (p.r) {
      const a = reg[p.r] || (reg[p.r] = mk());
      a.n++; a.i += p.i || 0;
      if (p.c) a.cs[p.c] = (a.cs[p.c] || 0) + 1;
      if (p.cat) a.cats[p.cat] = (a.cats[p.cat] || 0) + 1;
    }
  });
  const top = o => { let k = null, v = -1; for (const x in o) if (o[x] > v) { v = o[x]; k = x; } return k; };
  const finish = (m, kind) => Object.entries(m).map(([name, a]) =>
    ({ name, kind, n: a.n, i: a.i, c: top(a.cs), cat: top(a.cats), reg: top(a.regs) }))
    .sort((x, y) => y.n - x.n);
  ORGS = { dev: finish(dev, 'dev'), vrf: finish(vrf, 'vrf'), reg: finish(reg, 'reg') };
  return ORGS;
}

// 交付率共用：依任一維度分群
function deliv(keyFn,minN){
  const g={};
  S.p.forEach(p=>{const k=keyFn(p);
    if(!k||!p.e||!p.fy)return; const yr=2026-p.fy; if(yr<3)return;
    const a=g[k]||(g[k]={e:0,i:0,n:0});a.e+=p.e*yr;a.i+=p.i||0;a.n++});
  return Object.entries(g).filter(([,v])=>v.n>=(minN||10))
    .map(([k,v])=>[k,v.n,v.e,v.i,Math.round(1000*v.i/v.e)/10]).sort((a,b)=>a[4]-b[4]);
}

  <td class="n">${fmt(e)}</td><td class="n">${fmt(i)}</td>

function dl(name,rows){
  const csv='﻿'+rows.map(r=>r.map(c=>{
    const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}

  const el=document.getElementById('mapc'); if(!el||!window.L) return;
  if(_map){_map.remove();_map=null}
  _map=L.map(el,{worldCopyJump:true,scrollWheelZoom:true}).setView([12,20],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom:14,attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd'}).addTo(_map);
  const q=S.q.toLowerCase();
  let rows=S.p.filter(p=>p.ll);
  if(S.fg!=='all') rows=rows.filter(p=>p.gp!=='country');
  if(S.fr) rows=rows.filter(p=>p.r===S.fr);

    ||(p.c||'').toLowerCase().includes(q)||(p.t||'').toLowerCase().includes(q));
  rows=rows.sort((a,b)=>(b.i||0)-(a.i||0)).slice(0,4000);

     .bindPopup(`<div class="mpop"><b>${esc(p.n||'')}</b>

     .addTo(g);

const NEEDP=new Set(['projects','devs','map','delivery','methods','project']);
let PLOAD=null;
const PP={state:'idle',done:0,total:0,msg:''};

function expand(z){
  const out=new Array(z.n),D=z.dicts,C=z.data,K=z.cols;
  for(let i=0;i<z.n;i++){
    const o={};
    for(let j=0;j<K.length;j++){
      const k=K[j],v=C[k][i];
      if(D[k]){if(v>=0)o[k]=D[k][v];}
      else if(v!=null)o[k]=v;
    }
    out[i]=o;
  }
  return out;
}

function paintProg(){
  const el=document.getElementById('pbar');
  if(!el)return;
  const pct=PP.total?Math.min(100,Math.round(100*PP.done/PP.total)):0;
  el.style.width=pct+'%';
  const t=document.getElementById('ptxt');
  if(t)t.textContent=pct+'%';
}

async function loadProjects(){
  const url='data/projects.min.json'+DV;
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  PP.total=(S.meta&&S.meta.psize)||0;
  let buf;
  if(r.body&&r.body.getReader&&PP.total){
    const rd=r.body.getReader(),parts=[];let got=0;
    for(;;){
      const c=await rd.read();
      if(c.done)break;
      parts.push(c.value);got+=c.value.length;PP.done=got;paintProg();
    }
    buf=new Uint8Array(got);let o=0;
    for(const c of parts){buf.set(c,o);o+=c.length;}
    buf=new TextDecoder().decode(buf);
  }else{
    buf=await r.text();
  }
  return expand(JSON.parse(buf));
}

function needProjects(){
  if(S.p.length||PLOAD)return;
  PP.state='loading';PP.done=0;
  PLOAD=loadProjects()
    .then(p=>{S.p=p;PP.state='done';render();})
    .catch(e=>{PP.state='error';PP.msg=e.message;PLOAD=null;render();console.error(e);});
}
window.retryProjects=()=>{PP.state='idle';PLOAD=null;render();};

function progBlock(){
  if(PP.state==='error')return `<div class="loading">${T('loaderr')}
    <div class="small muted" style="margin-top:6px">${esc(PP.msg)}</div>
    <span class="more" onclick="retryProjects()">${T('retry')}</span></div>`;
  return `<div class="loading">${T('loadp')}
    <div class="pwrap"><i id="pbar"></i></div>
    <div class="small muted" id="ptxt">0%</div></div>`;
}
