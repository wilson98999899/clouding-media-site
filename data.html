<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碳市場資料庫｜Clouding Media</title>
<meta name="description" content="全球自願碳市場登記處資料與每日情報。專案、國家、開發商、交付率分析。">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="stylesheet" href="styles.css?v=20261012a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Playfair+Display:wght@500;600;700&family=Open+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<script src="i18n.js?v=20261012a"></script>
<style>
/* ── 語言 ── */
html[lang="my"] body,html[lang="my"] h1,html[lang="my"] h2,html[lang="my"] h3,
html[lang="my"] .lead,html[lang="my"] .brand{
  font-family:"Noto Sans Myanmar","Myanmar Text","Padauk",var(--sans);
  line-height:1.95;
}
html[lang="my"] .dbnav a,html[lang="my"] table.dt,html[lang="my"] .news h4{line-height:1.8}


#mapc{height:560px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sand)}
@media(max-width:900px){#mapc{height:420px}}
.leaflet-container{font:14px var(--sans);background:var(--sand)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:12px 0 0;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.mpop{font:14px var(--sans);line-height:1.6;max-width:260px}
.mpop b{display:block;margin-bottom:4px}
.mpop .mt{color:#5d6b78;font-size:12.5px}

/* ── 資料庫專屬 ── */
.db{display:grid;grid-template-columns:186px 1fr;gap:34px;align-items:start}
@media(max-width:900px){.db{grid-template-columns:1fr;gap:20px}}
.dbnav{position:sticky;top:94px}
@media(max-width:900px){.dbnav{position:static;display:flex;flex-wrap:wrap;gap:6px}}
.dbnav .grp{font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin:20px 0 8px}
@media(max-width:900px){.dbnav .grp{width:100%;margin:8px 0 2px}}
.dbnav a{display:block;padding:7px 11px;font-size:14.5px;color:var(--muted);
  text-decoration:none;border-left:2px solid transparent;cursor:pointer;border-radius:0 4px 4px 0}
.dbnav a:hover{color:var(--ink);background:var(--sand)}
.dbnav a.on{color:var(--brand);font-weight:600;border-left-color:var(--brand);background:var(--sand)}
@media(max-width:900px){.dbnav a{border:1px solid var(--line);border-radius:4px;padding:6px 12px}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:4px 0 30px}
.kpi{border-left:3px solid var(--brand);padding-left:16px}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.18;
  letter-spacing:-.3px;color:var(--brand)}
.kpi .k{font-size:13.5px;color:var(--muted);margin-top:3px}
.kpi.hl{border-left-color:var(--warn)}
.kpi.hl .v{color:var(--warn)}

.block{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:22px 24px;margin-bottom:22px}
.block h3{font-size:16px;margin:0 0 14px;color:var(--ink)}
.block .note{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:12px}

table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt th{text-align:left;font-weight:700;color:var(--muted);font-size:12.5px;
  letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;user-select:none}
table.dt th:hover{color:var(--ink)}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover td{background:var(--sand)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pct{font-weight:700}
.pct.lo{color:#a83232}.pct.md{color:var(--warn)}.pct.hi{color:var(--accent)}
.clickrow{cursor:pointer}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl input,.ctl select{font:14.5px var(--sans);padding:8px 12px;border:1px solid var(--line);
  border-radius:4px;background:var(--paper);color:var(--ink)}
.ctl input[type=search]{min-width:260px;flex:1;max-width:380px}

.spark{display:flex;align-items:flex-end;gap:2px;height:52px}
.spark i{flex:1;background:var(--brand);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.spark i:hover{opacity:1}
.sparkx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}

.bars b{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px;font-weight:400}
.bars .l{width:190px;flex:0 0 190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{flex:1;height:8px;background:var(--sand);border-radius:4px;overflow:hidden}
.bars .fl{height:100%;background:var(--grad);border-radius:4px}
.bars .nn{width:70px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.news{border-top:1px solid var(--line)}
.news article{padding:16px 0;border-bottom:1px solid var(--line)}
.news h4{margin:0 0 5px;font-size:15.5px;font-weight:600;line-height:1.5}
.news h4 a{text-decoration:none}
.news h4 a:hover{color:var(--accent)}
.news .meta{font-size:12.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.news .d{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6}
.cat{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;font-weight:600}
.cat-標準{background:var(--accent-soft);color:var(--accent)}
.cat-市場{background:#eaf0f7;color:var(--navy)}
.cat-法規{background:#f0ecf7;color:#5a4a8a}
.cat-完整性{background:var(--warn-soft);color:var(--warn)}
.cat-專案{background:#eaf1ed;color:#2d6a4f}
.cat-科學{background:#eef1f3;color:#4a5a68}
.cat-其他,.cat-一般{background:var(--sand);color:var(--muted)}
.tg{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;
  border:1px solid var(--line);color:var(--muted)}
.more{display:inline-block;margin-top:14px;font-size:14.5px;color:var(--accent);
  cursor:pointer;font-weight:600}
.more:hover{text-decoration:underline}
.loading{color:var(--muted);padding:50px 0;text-align:center}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}

/* ── 專案探索版面 ── */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px}
.ptabs button{font:600 14.5px var(--sans);padding:9px 16px;border:none;background:none;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-bottom:38px}
.theme{position:relative;overflow:hidden;border:none;cursor:pointer;border-radius:10px;
  min-height:96px;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:flex-start;text-align:left;color:#fff;font-family:var(--sans)}
.theme::after{content:"";position:absolute;inset:0;opacity:.3;
  background-image:radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1px);
  background-size:9px 9px}
.theme:hover{filter:brightness(1.08)}
.theme .tn{position:relative;z-index:1;font-size:15.5px;font-weight:700;line-height:1.35}
.theme .tc{position:relative;z-index:1;font-size:12.5px;opacity:.85;margin-top:3px;
  font-variant-numeric:tabular-nums}

.catsec{margin-bottom:34px}
.cathead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.cathead .cdot{width:13px;height:13px;border-radius:4px;flex:0 0 auto}
.cathead h3{margin:0;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.cathead h3:hover{color:var(--brand)}
.cathead .cn{font-size:12.5px;color:var(--muted);background:var(--sand);
  padding:1px 8px;border-radius:9px;font-variant-numeric:tabular-nums}
.cathead .sp{flex:1}
.arw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0}
.arw:hover{border-color:var(--brand);color:var(--brand)}

.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:218px;gap:14px;
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.scroller::-webkit-scrollbar{height:7px}
.scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.pcard{display:flex;flex-direction:column;text-decoration:none;cursor:pointer;
  scroll-snap-align:start;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--paper);transition:box-shadow .16s,border-color .16s}
.pcard:hover{box-shadow:0 5px 18px rgba(0,109,167,.11);border-color:#cfe0e9}
.pthumb{position:relative;display:block;aspect-ratio:16/10;overflow:hidden}
.pthumb::after{content:"";position:absolute;inset:0;opacity:.28;
  background-image:radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:8px 8px}
.piso{position:absolute;left:12px;bottom:7px;z-index:1;font-family:var(--serif);
  font-size:27px;font-weight:700;color:rgba(255,255,255,.92);letter-spacing:1px;line-height:1}
.preg{position:absolute;right:9px;top:8px;z-index:1;font-size:10.5px;font-weight:700;
  letter-spacing:.6px;color:rgba(255,255,255,.95);background:rgba(0,0,0,.26);
  padding:2px 6px;border-radius:3px}
.ptitle{padding:11px 13px 0;font-size:14px;font-weight:600;color:var(--ink);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.pdev{padding:4px 13px 0;font-size:12.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pchips{display:flex;gap:5px;flex-wrap:wrap;padding:9px 13px 12px}
.pchips em{font-style:normal;font-size:11px;background:var(--sand);color:var(--muted);
  border:1px solid var(--line);padding:1px 7px;border-radius:3px;max-width:118px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.scroller{grid-auto-columns:176px}.themes{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.src{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:28px;
  padding-top:16px;border-top:1px solid var(--line)}
</style>
<script src="lang.js?v=20261012a" defer></script>
</head>
<body>

<header>
<div class="wrap">
  <nav class="nav" id="nav">
    <a class="brand" href="index.html"><img src="images/logo-lockup-white.png" alt="FOREST AIR"></a>
    <button class="burger" onclick="document.getElementById('nav').classList.toggle('open')">選單</button>
    <span class="sp"></span>
    <a class="lk" href="index.html">首頁</a>
    <a class="lk" href="services.html">服務</a>
    <a class="lk on" href="data.html">資料庫</a>
    <a class="lk" href="about.html">關於</a>
    <a class="lk" href="contact.html">聯絡</a>
    <a class="cta" href="contact.html">聯絡我們</a>
    <span class="langbar" id="langbar"></span>
  </nav>
</div>
</header>

<div class="hero" style="padding:62px 0 42px">
<div class="wrap">
  <div class="rule"></div>
  <div class="eyebrow">Carbon Market Database</div>
  <h1 id="hh1" style="font-size:clamp(26px,4vw,40px);margin-bottom:12px">碳市場資料庫</h1>
  <p class="lead" id="hlead" style="margin-bottom:0">
    全球自願碳市場的登記處資料與每日情報。可依國家、專案類型、開發商翻閱，
    並檢視我們自行計算的交付率——事前預估與實際核發之間的落差。
  </p>
</div>
</div>

<section class="tight">
<div class="wrap">
<div class="db">

  <aside class="dbnav">
    <div class="grp">瀏覽</div>
    <a data-v="dash" class="on">總覽</a>
    <a data-v="countries">國家</a>
    <a data-v="projects">專案</a>
    <a data-v="devs">開發商</a>
    <a data-v="map">地圖</a>
    <div class="grp">分析</div>
    <a data-v="delivery">交付率</a>
    <a data-v="methods">方法學</a>
    <div class="grp">情報</div>
    <a data-v="pulse">每日動態</a>
  </aside>

  <div id="view"><div class="loading" id="boot">載入資料中…</div></div>

</div>
</div>
</section>

<footer>
<div class="wrap">
  <div class="small muted">
    © <span id="yr"></span> 奧森氧整合科技國際股份有限公司 ｜ Clouding Media
  </div>
</div>
</footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();

let LANG=(localStorage.getItem('cmlang')||(navigator.language||'').slice(0,2).replace('zh','zh'))||'zh';
if(!window.I18N[LANG])LANG='zh';
const T=(k,v)=>{let x=(window.I18N[LANG]||{})[k]; if(x==null)x=(window.I18N.zh||{})[k]; if(x==null)return k;
  if(v)Object.keys(v).forEach(n=>x=x.split('{'+n+'}').join(v[n])); return x;};
const TC=c=>((window.I18N[LANG]||{}).cat||{})[c]||c;
const TG=g=>((window.I18N[LANG]||{}).tag||{})[g]||g;
function setLang(l){LANG=l;localStorage.setItem('cmlang',l);document.documentElement.lang=l;
  document.title=T('title');applyStatic();buildSw();render();}
function buildSw(){if(window.LangBar)window.LangBar.draw();}
function applyStatic(){
  const set=(sel,k)=>{const e=document.querySelector(sel);if(e)e.textContent=T(k)};
  set('#hh1','h1'); set('#hlead','lead');
  document.querySelectorAll('.dbnav a[data-v]').forEach(a=>a.textContent=T(a.dataset.v));
  document.querySelectorAll('.dbnav .grp').forEach((g,i)=>g.textContent=T(['nav_browse','nav_analysis','nav_intel'][i]));
}
window.setLang=setLang;

const S={p:[],c:[],meta:null,news:null,view:'dash',sel:null,q:'',fr:'',fs:'',fc:'',fg:'good',
         sort:{k:'i',d:-1},lim:60};
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const big=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':Math.round(n);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pc=v=>v==null?'':v<25?'lo':v<60?'md':'hi';
const ago=ts=>{if(!ts)return'';const h=(Date.now()/1000-ts)/3600;
  return h<1?'剛剛':h<24?Math.round(h)+' 小時前':Math.round(h/24)+' 天前'};

function spark(sr){
  if(!sr||!sr.length)return'<div class="note">無年度資料</div>';
  const mx=Math.max(...sr.map(x=>x[1]))||1;
  return'<div class="spark">'+sr.map(x=>`<i style="height:${Math.max(1,x[1]/mx*100)}%" title="${x[0]}：${fmt(x[1])}"></i>`).join('')
    +`</div><div class="sparkx"><span>${sr[0][0]}</span><span>${sr[sr.length-1][0]}</span></div>`;
}
function bars(o,m){
  const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,m||8);
  if(!e.length)return'<div class="note">—</div>';
  const mx=e[0][1];
  return'<div class="bars">'+e.map(([k,v])=>`<b><span class="l" title="${esc(k)}">${esc(k)}</span>
    <span class="tr"><span class="fl" style="width:${v/mx*100}%"></span></span>
    <span class="nn">${fmt(v)}</span></b>`).join('')+'</div>';
}

const V={};
S.pmode='disc';S.fth=null;S.fcat='';

V.dash=()=>{
  const m=S.meta,reg={},typ={},vint={};
  S.p.forEach(p=>{if(p.r)reg[p.r]=(reg[p.r]||0)+p.i;if(p.t)typ[p.t]=(typ[p.t]||0)+p.i});
  S.c.forEach(c=>(c.vint||[]).forEach(([y,q])=>vint[y]=(vint[y]||0)+q));
  const nw=(S.news?.items||[]).filter(x=>x.rel).slice(0,5);
  return `<div class="kpis">
    <div class="kpi"><div class="v">${m.projects.toLocaleString()}</div><div class="k">${T('k_projects')}</div></div>
    <div class="kpi"><div class="v">${m.countries}</div><div class="k">${T('k_countries')}</div></div>
    <div class="kpi"><div class="v">${big(m.issued)}</div><div class="k">${T('k_issued')}</div></div>
    <div class="kpi"><div class="v">${m.registries.length}</div><div class="k">${T('k_registries')}</div></div>
  </div>
  <div class="block"><h3>${T('h_vintage')}</h3>${spark(Object.entries(vint).map(([y,q])=>[+y,q]).sort((a,b)=>a[0]-b[0]))}</div>
  <div class="block"><h3>${T('h_byreg')}</h3>${S.p.length?bars(reg):`<div class="note">${T('loadp')}</div>`}</div>
  <div class="block"><h3>${T('h_bytype')}</h3>${S.p.length?bars(typ,10):`<div class="note">${T('loadp')}</div>`}</div>
  <div class="block"><h3>${T('h_top12')}</h3>
    <table class="dt"><thead><tr><th>${T('t_country')}</th><th>${T('t_region')}</th><th class="n">${T('t_proj')}</th><th class="n">${T('t_issued')}</th><th class="n">${T('t_delivery')}</th></tr></thead>
    <tbody>${S.c.slice(0,12).map(c=>`<tr class="clickrow" onclick="go('country','${esc(c.name)}')">
      <td><strong>${esc(c.name)}</strong></td><td>${esc(c.region)||'—'}</td>
      <td class="n">${fmt(c.n)}</td><td class="n">${fmt(c.issued)}</td>
      <td class="n pct ${pc(c.delivery)}">${c.delivery==null?'—':c.delivery+'%'}</td></tr>`).join('')}</tbody></table></div>
  ${nw.length?`<div class="block"><h3>${T('h_latest')}</h3><div class="news">${nw.map(newsCard).join('')}</div>
    <span class="more" onclick="go('pulse')">${T('seeall')}</span></div>`:''}`;
};

V.countries=()=>{
  const q=S.q.toLowerCase();
  const rows=S.c.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.region||'').toLowerCase().includes(q));
  return `<div class="crumb">國家</div>
  <div class="ctl"><input type="search" id="q" placeholder="${T('s_country')}" value="${esc(S.q)}">
    <span class="muted small">${rows.length} 個國家</span></div>
  <div class="block"><table class="dt"><thead><tr>
    <th>${T('t_country')}</th><th>${T('t_region')}</th><th class="n">${T('t_proj')}</th><th class="n">${T('t_devs')}</th>
    <th class="n">${T('t_issued')}</th><th class="n">${T('t_retired')}</th><th class="n">${T('t_delivery')}</th></tr></thead>
  <tbody>${rows.slice(0,S.lim).map(c=>`<tr class="clickrow" onclick="go('country','${esc(c.name)}')">
    <td><strong>${esc(c.name)}</strong></td><td>${esc(c.region)||'—'}</td>
    <td class="n">${fmt(c.n)}</td><td class="n">${fmt(c.devs)}</td>

  const by={};S.p.forEach(p=>{(by[p.cat]||(by[p.cat]=[])).push(p)});
  const order=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
  const secs=order.map(c=>{
    const top=[...by[c]].sort((x,y)=>(y.i||0)-(x.i||0)).slice(0,14);
    return `<div class="catsec">

  }).join('');
  return tiles+secs;
}

function projAll(){
  const q=S.q.toLowerCase();
  let rows=S.p;
  if(S.fth!=null&&THEMES[S.fth])rows=rows.filter(THEMES[S.fth].f);
  if(S.fcat)rows=rows.filter(p=>p.cat===S.fcat);
  if(q)rows=rows.filter(p=>(p.n||'').toLowerCase().includes(q)||(p.id||'').toLowerCase().includes(q)
    ||(p.c||'').toLowerCase().includes(q)||(p.d||'').toLowerCase().includes(q)||(p.t||'').toLowerCase().includes(q));
  if(S.fr)rows=rows.filter(p=>p.r===S.fr);
  const k=S.sort.k,d=S.sort.d;
  rows=[...rows].sort((a,b)=>{const x=a[k],y=b[k];
    if(typeof x==='number'||typeof y==='number')return((y||0)-(x||0))*(d<0?1:-1);
    return String(x||'').localeCompare(String(y||''))*(d<0?-1:1)});
  window.__rows=rows;
  const regs=[...new Set(S.p.map(p=>p.r).filter(Boolean))].sort();
  const cats=Object.keys(CATMETA).filter(c=>S.p.some(p=>p.cat===c));
  const active=(S.fth!=null&&THEMES[S.fth])?T(THEMES[S.fth].k):(S.fcat?catName(S.fcat):'');
  return `<div class="ctl">
    <input type="search" id="q" placeholder="${T('s_project')}" value="${esc(S.q)}">
    <select id="fr"><option value="">${T('f_allreg')}</option>${regs.map(r=>`<option${S.fr===r?' selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="fcat"><option value="">${T('f_allcat')}</option>${cats.map(c=>`<option value="${esc(c)}"${S.fcat===c?' selected':''}>${esc(catName(c))}</option>`).join('')}</select>
    ${active?`<span class="pill">${esc(active)} <b onclick="S.fth=null;S.fcat='';render()" style="cursor:pointer">&#10005;</b></span>`:''}
    <span class="muted small">${rows.length.toLocaleString()} ${T('rows')}</span>
    <span class="more" style="margin:0" onclick="csvProjects(window.__rows||[])">${T('csv')}</span>
  </div>
  <div class="block"><table class="dt"><thead><tr>
    <th data-s="id">ID</th><th data-s="n">${T('t_name')}</th><th data-s="c">${T('t_country')}</th>
    <th data-s="r">${T('t_registry')}</th><th data-s="cat">${T('t_cat')}</th><th data-s="t">${T('t_type')}</th>
    <th class="n" data-s="e">${T('t_est')}</th><th class="n" data-s="i">${T('t_issued')}</th></tr></thead>
  <tbody>${rows.slice(0,S.lim).map(p=>`<tr class="clickrow" onclick="go('project','${esc(p.id)}')">
    <td><span class="pill">${esc(p.id)}</span></td><td>${esc(p.n)}</td>
    <td>${esc(p.c)||'—'}</td>
    <td>${esc(p.r)}</td><td>${esc(catName(p.cat))}</td><td>${esc(p.t)||'—'}</td>
    <td class="n">${fmt(p.e)}</td><td class="n">${fmt(p.i)}</td></tr>`).join('')}</tbody></table>
  ${rows.length>S.lim?`<span class="more" onclick="S.lim+=80;render()">${T('more80')}</span>`:''}</div>`;

// 交付率共用：依任一維度分群
function deliv(keyFn,minN){
  const g={};
  S.p.forEach(p=>{const k=keyFn(p);
    if(!k||!p.e||!p.fy)return; const yr=2026-p.fy; if(yr<3)return;
    const a=g[k]||(g[k]={e:0,i:0,n:0});a.e+=p.e*yr;a.i+=p.i||0;a.n++});
  return Object.entries(g).filter(([,v])=>v.n>=(minN||10))
    .map(([k,v])=>[k,v.n,v.e,v.i,Math.round(1000*v.i/v.e)/10]).sort((a,b)=>a[4]-b[4]);
}
const dtable=(rows,lbl)=>`<table class="dt"><thead><tr><th>${lbl}</th><th class="n">${T('t_n')}</th>
  <th class="n">${T('t_expcum')}</th><th class="n">${T('t_actual')}</th><th class="n">${T('t_delivery')}</th></tr></thead>
  <tbody>${rows.map(([k,n,e,i,d])=>`<tr><td>${esc(k)}</td><td class="n">${n}</td>
  <td class="n">${fmt(e)}</td><td class="n">${fmt(i)}</td>
  <td class="n pct ${pc(d)}">${d}%</td></tr>`).join('')}</tbody></table>`;

V.delivery=()=>{
  const rows=S.c.filter(c=>c.cmp_n>=3&&c.delivery!=null).sort((a,b)=>a.delivery-b.delivery);
  const byType=deliv(p=>p.t,10);
  const byReg=deliv(p=>p.r,5);
  const byRegion=deliv(p=>p.rg,10);
  const byCohort=deliv(p=>{const y=p.fy;return y?(y<2008?'2007 以前':y<2013?'2008–2012':
    y<2018?'2013–2017':y<2021?'2018–2020':'2021 以後'):null},10)
    .sort((a,b)=>a[0].localeCompare(b[0]));
  const all=S.p.filter(p=>p.e&&p.fy&&(2026-p.fy)>=3);
  const te=all.reduce((s,p)=>s+p.e*(2026-p.fy),0), ti=all.reduce((s,p)=>s+(p.i||0),0);
  return `<div class="crumb">分析</div>
  <h2 style="font-size:26px;margin-bottom:6px">交付率</h2>
  <p class="muted small" style="margin-bottom:20px">事前預估與實際核發之間的落差。本站自行計算，登記處不直接提供。</p>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(all.length)}</div><div class="k">${T('k_sample')}</div></div>
    <div class="kpi"><div class="v">${big(te)}</div><div class="k">${T('k_exp')}</div></div>
    <div class="kpi"><div class="v">${big(ti)}</div><div class="k">${T('k_act')}</div></div>
    <div class="kpi hl"><div class="v">${(100*ti/te).toFixed(1)}%</div><div class="k">${T('k_all_delivery')}</div></div>
  </div>
  <div class="block"><h3>${T('h_method')}</h3>
    <div class="note">以登記處所載「事前年預估減量」乘以運行年數（2026 − 起始年）作為事前預估累計，
      對照「已核發額度」。僅納入兩者皆有、且已運行滿 3 年的專案。<br><br>
      <strong>限制：</strong>此指標會低估仍在爬坡期的專案，亦受計入期設計與查證節奏影響。
      應作為<strong>量級比較</strong>，不作為個案評價。</div></div>
  <div class="block"><h3>${T('h_reg')}</h3>${dtable(byReg,'登記處')}</div>
  <div class="block"><h3>${T('h_cohort')}</h3>${dtable(byCohort,'世代')}
    <div class="note">近年世代的交付率偏低屬預期——專案仍在爬坡，尚未完成全部查證週期。</div></div>
  <div class="block"><h3>${T('h_type')}</h3>${dtable(byType,'類型')}</div>

V.methods=()=>{
  const rows=deliv(p=>p.m,8).filter(r=>r[0].length<70);

// ── CSV 匯出 ──
function dl(name,rows){
  const csv='﻿'+rows.map(r=>r.map(c=>{
    const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
window.csvDeliv=()=>dl('交付率_依國家.csv',
  [['國家','地區','案數','預估累計','實際核發','交付率%']].concat(
   S.c.filter(c=>c.cmp_n>=3&&c.delivery!=null).sort((a,b)=>a.delivery-b.delivery)
    .map(c=>[c.name,c.region,c.cmp_n,Math.round(c.cmp_exp),Math.round(c.cmp_act),c.delivery])));
window.csvProjects=rows=>dl('專案清單.csv',
  [['ID','名稱','國家','地區','登記處','類型','範疇','方法學','起始年','年預估','已核發','已註銷']].concat(
   rows.map(p=>[p.id,p.n,p.c,p.rg,p.r,p.t,p.sc,p.m,p.fy,p.e,p.i,p.rt||0])));


const GP={site:['#0e6b5e','地點＋州省驗證'],place:['#128c7a','地點欄位'],
          admin:['#7aa6a0','州／省質心'],name:['#b59a4a','自名稱推得'],
          country:['#b8c3c0','國家質心']};
let _map=null,_layer=null;

V.map=()=>{
  const m=S.meta.geo||{};
  const tot=Object.values(GP).length;
  return `<div class="crumb">${T('projects')}</div>
  <h2 style="font-size:26px;margin-bottom:6px">${T('map')}</h2>
  <p class="muted small" style="margin-bottom:16px">${T('map_sub')}</p>
  <div class="ctl">
    <input type="search" id="q" placeholder="${T('s_project')}" value="${esc(S.q)}">
    <select id="fr"><option value="">${T('f_allreg')}</option>${
      [...new Set(S.p.map(p=>p.r).filter(Boolean))].sort().map(r=>
      `<option${S.fr===r?' selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="fg">
      <option value="good"${S.fg!=='all'?' selected':''}>${T('map_good')}</option>
      <option value="all"${S.fg==='all'?' selected':''}>${T('map_all')}</option>
    </select>
    <span class="muted small" id="mcount"></span>
  </div>
  <div id="mapc"></div>
  <div class="legend">${Object.entries(GP).map(([k,[c,l]])=>
    `<span><i style="background:${c}"></i>${T('gp_'+k)}（${fmt(m[k]||0)}）</span>`).join('')}</div>
  <div class="block" style="margin-top:20px"><h3>${T('map_note_h')}</h3>
    <div class="note">${T('map_note')}</div></div>`;
};

function drawMap(){
  const el=document.getElementById('mapc'); if(!el||!window.L) return;
  if(_map){_map.remove();_map=null}
  _map=L.map(el,{worldCopyJump:true,scrollWheelZoom:true}).setView([12,20],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom:14,attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd'}).addTo(_map);
  const q=S.q.toLowerCase();
  let rows=S.p.filter(p=>p.ll);
  if(S.fg!=='all') rows=rows.filter(p=>p.gp!=='country');
  if(S.fr) rows=rows.filter(p=>p.r===S.fr);
  if(q) rows=rows.filter(p=>(p.n||'').toLowerCase().includes(q)
    ||(p.c||'').toLowerCase().includes(q)||(p.t||'').toLowerCase().includes(q));
  rows=rows.sort((a,b)=>(b.i||0)-(a.i||0)).slice(0,4000);
  const g=L.layerGroup();
  rows.forEach(p=>{
    const col=(GP[p.gp]||GP.country)[0];
    const r=p.i>5e6?9:p.i>1e6?7:p.i>1e5?5:3.5;
    L.circleMarker(p.ll,{radius:r,color:col,weight:1,fillColor:col,fillOpacity:.55})
     .bindPopup(`<div class="mpop"><b>${esc(p.n||'')}</b>
       <span class="mt">${esc(p.c||'')} ｜ ${esc(p.r||'')} ｜ ${esc(p.t||'—')}</span>
       <span class="mt">${T('t_issued')}：${fmt(p.i)} tCO₂e</span>
       <span class="mt">${T('gp_'+(p.gp||'country'))}</span></div>`)
     .addTo(g);
  });
  g.addTo(_map); _layer=g;
  const c=document.getElementById('mcount');
  if(c) c.textContent=fmt(rows.length)+' '+T('items')+(rows.length>=4000?'（'+T('map_cap')+'）':'');
}

const newsCard=i=>`<article>
  <h4><a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}</a></h4>
  <div class="meta"><span class="cat cat-${esc(i.c)}">${esc(i.c)}</span>
    <span>${esc(i.s)}</span><span>${ago(i.ts)}</span>

  ${i.d?`<div class="d">${esc(i.d).slice(0,190)}${i.d.length>190?'…':''}</div>`:''}
</article>`;

V.pulse=()=>{
  if(!S.news)return`<div class="loading">${T('loading_news')}</div>`;
  let it=S.news.items;
  if(S.fc)it=it.filter(x=>x.c===S.fc);
  if(S.q){const q=S.q.toLowerCase();it=it.filter(x=>(x.t+' '+x.d).toLowerCase().includes(q))}
  const cats=[...new Set(S.news.items.map(x=>x.c))];
  const cnt={};S.news.items.forEach(x=>cnt[x.c]=(cnt[x.c]||0)+1);
  return `<div class="crumb">情報</div>
  <h2 style="font-size:26px;margin-bottom:6px">每日動態</h2>
  <p class="muted small" style="margin-bottom:20px">
    自 ${S.news.sources.length} 個公開來源聚合，依碳市場相關性分類。更新於 ${esc(S.news.built)}。</p>
  <div class="ctl">
    <input type="search" id="q" placeholder="${T('s_news')}" value="${esc(S.q)}">
    <select id="fc"><option value="">${T('f_allcat')}</option>${cats.map(c=>
      `<option value="${esc(c)}"${S.fc===c?' selected':''}>${esc(c)}（${cnt[c]}）</option>`).join('')}</select>
    <span class="muted small">${it.length} 則</span>
  </div>
  <div class="block"><div class="news">${it.slice(0,S.lim).map(newsCard).join('')||`<div class="loading">${T('none')}</div>`}</div>
  ${it.length>S.lim?`<span class="more" onclick="S.lim+=40;render()">再顯示 40 則</span>`:''}</div>
  <div class="src">來源：${S.news.sources.map(esc).join('、')}。
    本頁僅聚合公開 RSS 之標題與摘要並連回原文，不轉載全文。分類由關鍵字規則自動產生，可能有誤。</div>`;
};

function go(v,sel){S.view=v;S.sel=sel||null;S.q='';S.lim=60;render();window.scrollTo(0,0)}
window.go=go;

const NEEDP=new Set(['projects','devs','map','delivery','methods','project']);
function render(){
  $('#view').innerHTML=(NEEDP.has(S.view)&&!S.p.length)
    ? `<div class="loading">${T('loadp')}</div>`
    : (V[S.view]||V.dash)();
  document.querySelectorAll('.dbnav a').forEach(a=>
    a.classList.toggle('on',a.dataset.v===S.view
      ||(S.view==='country'&&a.dataset.v==='countries')
      ||(S.view==='project'&&a.dataset.v==='projects')));
  const q=$('#q');
  if(q)q.oninput=e=>{S.q=e.target.value;S.lim=60;render();
    const n=$('#q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  ['fr','fs','fc','fg','fcat'].forEach(id=>{const el=$('#'+id);
    if(el)el.onchange=e=>{S[id]=e.target.value;if(id==='fcat')S.fth=null;S.lim=60;render()}});
  if(S.view==='map') setTimeout(drawMap,30);
  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.s;S.sort.d=(S.sort.k===k)?-S.sort.d:-1;S.sort.k=k;render()});
}
document.querySelectorAll('.dbnav a').forEach(a=>a.onclick=()=>go(a.dataset.v));

 .then(p=>{S.p=p;render();})
 .catch(e=>{const el=document.getElementById('view');
   if(el)el.innerHTML='<div class="loading">'+T('loaderr')+'<br><span class="small">'+esc(e.message)+'</span></div>';
   console.error(e);});
